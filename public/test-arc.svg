  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="40" />
  <text fill="#4d6028" font-family="'Plus Jakarta Sans', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="26" font-weight="bold">
    <textPath href="#textArc" startOffset="2%">
      مجموعة القديس بولس الرسول الكشفية
    </textPath>
  </text>
</svg>