<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Clockwise sweep for Arabic RTL text so "مجموعة" is at top-left and "الكشفية" is at bottom-right -->
    <path id="arabicArc" d="M 485 385 C 530 320, 540 250, 515 190 C 465 75, 335 25, 215 50" fill="none" />
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="48" />

  <!-- Arabic Curved Text: مجموعة القديس بولس الرسول الكشفية -->
  <text fill="#4a5e26" font-family="'Cairo', 'Plus Jakarta Sans', system-ui, Tahoma, sans-serif" font-size="26" font-weight="900" letter-spacing="0.5">
    <textPath href="#arabicArc" startOffset="3%">
      مجموعة القديس بولس الرسول الكشفية
    </textPath>
  </text>

  <!-- Scout Lily & Flame Emblem -->
  <!-- Left Olive Green Petal -->
  <path d="M 264 82
           C 215 90, 165 140, 155 195
           C 125 215, 75 265, 75 325
           C 75 385, 130 415, 180 388
           C 215 370, 240 335, 246 295
           C 225 255, 202 210, 222 150
           C 232 120, 248 95, 264 82 Z"
        fill="#4a5e26" />

  <!-- Right Golden Amber Flame (3 Lobes) -->
  <path d="M 264 88
           C 285 75, 325 105, 335 130
           C 358 105, 398 145, 388 190
           C 418 205, 438 255, 412 305
           C 432 330, 412 370, 368 380
           C 328 390, 292 350, 298 310
           C 338 315, 378 280, 368 215
           C 358 155, 298 125, 264 88 Z"
        fill="#f7a61a" />

  <!-- Stylized Tau Cross & SPS Monogram in Olive Green -->
  <!-- T Crossbar -->
  <path d="M 195 400 L 372 397"
        fill="none" stroke="#4a5e26" stroke-width="16" stroke-linecap="round" />

  <!-- T Vertical Stem extending down with hook at foot -->
  <path d="M 265 330 L 265 525 C 265 560, 245 568, 230 556"
        fill="none" stroke="#4a5e26" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram Letter 'S' (Standard calligraphic S) -->
  <path d="M 356 450 C 336 438, 308 446, 308 472 C 308 500, 360 504, 360 530 C 360 554, 334 562, 310 550"
        fill="none" stroke="#4a5e26" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram Letter 'P' (Uppercase P: straight vertical stem, loop on UPPER right only) -->
  <path d="M 388 430 L 388 554"
        fill="none" stroke="#4a5e26" stroke-width="16" stroke-linecap="round" />
  <path d="M 388 430 C 438 424, 452 446, 452 470 C 452 494, 426 504, 388 502"
        fill="none" stroke="#4a5e26" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram Letter 'S' (Second standard calligraphic S) -->
  <path d="M 498 450 C 478 438, 450 446, 450 472 C 450 500, 502 504, 502 530 C 502 554, 476 562, 452 550"
        fill="none" stroke="#4a5e26" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
</svg>