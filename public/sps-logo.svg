           C 490 165, 555 210, 605 268
           C 575 295, 555 315, 548 335
           C 605 325, 665 350, 698 402
           C 724 445, 722 492, 698 532
           C 672 570, 628 598, 570 614
           C 525 625, 485 608, 482 542
           C 525 580, 570 562, 595 525
           C 628 475, 598 420, 538 390
           C 468 355, 420 268, 436 150 Z"
        fill="#f5a800" />

  <!-- ============================================================ -->
  <!-- 3. SCOUT FLEUR-DE-LIS LEFT PETAL & STEM (#525f26)            -->
  <!-- Sweeps gracefully out to the left and into the vertical cross-->
  <!-- ============================================================ -->
  <!-- Upper Left Petal -->
  <path d="M 436 128
           C 402 132, 332 175, 268 232
           C 176 312, 125 412, 125 490
           C 125 565, 185 602, 265 592
           C 310 588, 355 555, 388 515
           C 415 482, 440 432, 452 378
           C 420 438, 380 472, 335 485
           C 280 500, 230 485, 205 445
           C 180 405, 195 345, 250 285
           C 305 225, 378 158, 436 128 Z"
