  <!-- Crossbar right extension of 't' -->
  <path d="M 388 648
           L 615 648
           C 628 648, 636 658, 636 668
           C 636 678, 628 688, 615 688
           L 425 688
           L 425 648 Z"
        fill="#525f26" />

  <!-- ============================================================ -->
  <!-- 4. SCOUT TYPOGRAPHY: 's', 'P', 's'                           -->
