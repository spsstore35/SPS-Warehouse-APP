<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- Clean white canvas -->
  <rect width="1000" height="1000" fill="#ffffff" />

  <!-- ============================================================ -->
  <!-- 1. ARABIC CALLIGRAPHY ARC (مجموعة القديس بولس الرسول الكشفية) -->
  <!-- Exact curve along the top right of the emblem                -->
  <!-- ============================================================ -->
  <g font-family="Noto Kufi Arabic, Noto Sans Arabic, sans-serif" font-weight="800" fill="#525f26">
    <!-- مجموعة -->
    <text transform="translate(450, 68) rotate(-18)" font-size="44" text-anchor="middle" direction="rtl">مجموعة</text>
    
    <!-- القديس -->
    <text transform="translate(625, 98) rotate(14)" font-size="44" text-anchor="middle" direction="rtl">القديس</text>
    
    <!-- بولس -->
    <text transform="translate(738, 185) rotate(38)" font-size="44" text-anchor="middle" direction="rtl">بولس</text>
    
    <!-- الرسول -->
    <text transform="translate(805, 305) rotate(60)" font-size="44" text-anchor="middle" direction="rtl">الرسول</text>
    
    <!-- الكشفية -->
    <text transform="translate(828, 455) rotate(84)" font-size="44" text-anchor="middle" direction="rtl">الكشفية</text>
  </g>

  <!-- ============================================================ -->
  <!-- 2. GOLDEN AMBER FLAME (RIGHT SCOUT PETAL)                     -->
  <!-- Three rounded flame lobes curving to the right (#f5a800)     -->
  <!-- ============================================================ -->
